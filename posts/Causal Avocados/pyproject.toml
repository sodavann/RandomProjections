[project]
authors = [{name = "lta", email = "sodavann@outlook.com"}]
name = "Causal Avocados"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = ["kagglehub>=0.3.12,<0.4", "jupyter>=1.1.1,<2", "ipywidgets>=8.1.7,<9"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]

[tool.pixi.dependencies]
ipykernel = ">=6.29.5,<7"
ipython = ">=9.4.0,<10"
pandas = ">=2.3.1,<3"
numpy = ">=2.3.2,<3"
matplotlib = ">=3.10.3,<4"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.14.5,<0.15"
tqdm = ">=4.67.1,<5"
iprogress = ">=0.4,<0.5"
